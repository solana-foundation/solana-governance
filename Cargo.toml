[workspace]
# The on-chain programs live in this root workspace so verified builds
# (solana-verify mounts and builds a single workspace directory) and SBF
# builds resolve features/locks without interference from the host-side
# workspaces (ncn, svmgov/cli, ...), which remain separate.
members = [
    "ncn/merkle-tree",
    "ncn/programs/ncn-snapshot",
    "svmgov/program/programs/svmgov_program",
]
exclude = [
    "ncn-router",
    "squads-client",
    "svmgov/cli",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
