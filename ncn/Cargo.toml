[workspace]
members = [
    "cli",
    "ledger",
    "verifier-service"
]
# merkle-tree and the program belong to the repo-root workspace: they are
# (dev-)dependencies of the on-chain programs, and verified builds run the
# root workspace under older cargo versions that reject path dependencies
# claimed by a different workspace.
exclude = [
    "merkle-tree",
    "programs/ncn-snapshot"
]

resolver = "2"

[patch.crates-io]
# Match Agave v4.3.0: its ledger requires APIs not in rocksdb 0.24.0.
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
