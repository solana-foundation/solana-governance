[package]
name = "ncn-merkle-tree"
version = "0.6.0-40200"
edition = "2021"
description = "Stake-weight merkle tree construction and proof verification for the Solana governance NCN"
license = "Apache-2.0"
repository = "https://github.com/solana-foundation/solana-governance"

[dependencies]
fast-math = "0.1"
serde = { version = "1.0", features = ["derive"] }
solana-program = { version = "4.0.0", default-features = false, features = [] }

[dev-dependencies]
hex = "0.4"
