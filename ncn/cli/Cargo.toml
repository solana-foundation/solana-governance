[package]
name = "cli"
version = "0.3.0-40000"
edition = "2021"

[dependencies]
anchor-client = "0.31.1"
clap = { version = "4", features = ["derive", "env"] }
fast-math = "0.1"

agave-snapshots               = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-accounts-db            = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-runtime                = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-ledger                 = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-rpc                    = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-geyser-plugin-manager  = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-unified-scheduler-pool = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-genesis-utils          = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-measure                = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-clap-utils             = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-vote                   = { version = "4.1.0", features = ["agave-unstable-api"] }
solana-vote-program           = { version = "4.1.0", default-features = false, features = ["agave-unstable-api"] }
solana-genesis-config         = "4.0.0"
solana-program = { version = "4.0.0", default-features = false, features = [] }
solana-sdk = "=4.0.1"
solana-stake-interface = { version = "3.1.0", features = ["sysvar", "serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
solana-metrics                = "4.1.0"
clap_old = { package = "clap", version = "2.33.1" }
crossbeam-channel = "0.5.15"
thiserror = "2.0"
anchor-lang = "0.31.1"
log = "0.4.22"
env_logger = "0.10.2"
flate2 = "1.0"
tokio = { version = "1.36.0", features = ["full"] }
anyhow = "1.0.86"
im = "15.1"
itertools = "0.11"
borsh = { version = "0.10.3" }
ncn-snapshot = { path = "../programs/ncn-snapshot" }
squads-client = { path = "../../squads-client" }
spl-stake-pool = { version = "2.0.0", default-features = false, features = ["no-entrypoint"] }
borsh_stake = { package = "borsh", version = "1.5", default-features = false }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
