[package]
name = "ncn-route"
version = "0.6.0-40200"
edition = "2021"

[[bin]]
name = "ncn-meta-cron"
path = "src/main.rs"

[[bin]]
name = "ncn-router"
path = "src/router.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
job_scheduler = "1.2"
solana-client = "2.1"
solana-sdk = "2.1"
borsh = { version = "1.5", features = ["derive"] }
dotenvy = "0.15"
rand = "0.8"
tiny_http = "0.12"
form_urlencoded = "1"

[patch.crates-io]
# Legacy Solana TLS clients need root bundles with the compromised eMudhra paths removed.
webpki-roots-24 = { package = "webpki-roots", path = "vendor/webpki-roots-0.24.0" }
webpki-roots-25 = { package = "webpki-roots", path = "vendor/webpki-roots-0.25.4" }

[dev-dependencies]
webpki-legacy = { package = "rustls-webpki", version = "0.101.7", features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103.16", features = ["ring"] }
webpki-roots-24 = { package = "webpki-roots", version = "0.24.0" }
webpki-roots-25 = { package = "webpki-roots", version = "0.25.4" }
webpki-roots = "1.0.10"
webpki-root-certs = "1.0.10"
rustls-pemfile = "2"
rustls-pki-types = "1"
