name: NCN network load test

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      router_url:
        description: Router base URL
        type: string
        default: https://ncn-governance.solana.com
      network:
        description: Verifier network
        type: choice
        options: [mainnet, testnet]
        default: mainnet
      duration:
        description: Load phase duration in seconds
        type: string
        default: "90"
      rps:
        description: Total logical requests/s across router and direct verifier probes
        type: string
        default: "2"
      concurrency:
        description: Maximum concurrent logical requests
        type: string
        default: "8"
      router_confidence:
        description: Target probability of selecting every verifier with uniform routing (0 to 1)
        type: string
        default: "0.999"
      slot:
        description: Snapshot slot (empty discovers the most common latest slot)
        type: string
      rpc_url:
        description: Optional Solana RPC URL for latest vote account discovery
        type: string
      requests:
        description: Request corpus path in the repository
        type: string
        default: ncn-router/loadtest/requests.toml

permissions:
  contents: read

concurrency:
  group: ncn-network-loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
          rustflags: ""

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ncn-router

      - name: Check load runner
        run: just ncn-network-loadtest-check

      - name: Test load runner with local fixtures
        run: just ncn-network-loadtest-test

      - name: Load router and verifier network
        env:
          ROUTER_URL: ${{ inputs.router_url || vars.NCN_LOADTEST_ROUTER_URL || 'https://ncn-governance.solana.com' }}
          NETWORK: ${{ inputs.network || vars.NCN_LOADTEST_NETWORK || 'mainnet' }}
          DURATION: ${{ inputs.duration || vars.NCN_LOADTEST_DURATION || '90' }}
          RPS: ${{ inputs.rps || vars.NCN_LOADTEST_RPS || '2' }}
          CONCURRENCY: ${{ inputs.concurrency || vars.NCN_LOADTEST_CONCURRENCY || '8' }}
          ROUTER_CONFIDENCE: ${{ inputs.router_confidence || vars.NCN_LOADTEST_ROUTER_CONFIDENCE || '0.999' }}
          SLOT: ${{ inputs.slot }}
          RPC_URL: ${{ inputs.rpc_url || vars.NCN_LOADTEST_RPC_URL }}
          REQUESTS: ${{ inputs.requests || vars.NCN_LOADTEST_REQUESTS || 'ncn-router/loadtest/requests.toml' }}
        run: |
          args=(--router-url "$ROUTER_URL" --network "$NETWORK" --duration "$DURATION"
                --rps "$RPS" --concurrency "$CONCURRENCY" --requests "$REQUESTS"
                --router-confidence "$ROUTER_CONFIDENCE")
          if [[ -n "$SLOT" ]]; then
            args+=(--slot "$SLOT")
          fi
          if [[ -n "$RPC_URL" ]]; then
            args+=(--rpc-url "$RPC_URL")
          fi
          just ncn-network-loadtest "${args[@]}"

      - name: Upload report and request evidence
        id: report_artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ncn-network-loadtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: loadtest-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run summary
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report_artifact.outputs.artifact-url }}
        run: |
          if [[ -f loadtest-results/summary.md ]]; then
            if [[ -n "$REPORT_ARTIFACT_URL" ]]; then
              sed "s|(router-failures.json)|($REPORT_ARTIFACT_URL) (JSON inside the report artifact)|g" \
                loadtest-results/summary.md >> "$GITHUB_STEP_SUMMARY"
            else
              cat loadtest-results/summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
