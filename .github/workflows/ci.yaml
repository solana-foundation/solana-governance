name: CI

# Compile-checks and tests every suite in the repo — the CLIs, the on-chain
# programs (LiteSVM), the standalone client crates (squads-client, ncn-router),
# and the frontend — on every pull request and on pushes to main, so build
# breakage and test regressions are caught before a release tag is cut. No
# binaries are uploaded here.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.93.1"
  # Agave release providing cargo-build-sbf for the on-chain program build.
  AGAVE_VERSION: "3.1.10"

  # Keep the formatter task and local development on the same Just release.
  JUST_VERSION: "1.39.0"

jobs:
  quality:
    name: Format & lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: just fmt

      - name: Run lint checks
        run: just lint

  build:
    name: Build & test CLIs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # This action defaults RUSTFLAGS to "-D warnings", which turns upstream
          # deprecations from anchor's #[program] macro (e.g. AccountInfo::realloc)
          # into hard errors. The install scripts build without -D warnings, so
          # clear it here to match the shipped build.
          rustflags: ""

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            ncn
            svmgov/cli

      - name: Build ncn CLI
        working-directory: ncn
        run: cargo build --locked -p ncn-cli

      - name: Build svmgov CLI
        working-directory: svmgov/cli
        run: cargo build --locked

      # The ncn program's integration coverage lives in the LiteSVM ncn_flow
      # suite, which the program job runs via `-p svmgov_program`.
      - name: Test ncn CLI and verifier-service
        working-directory: ncn
        run: cargo test --locked -p ncn-cli -p verifier-service

      - name: Test svmgov CLI
        working-directory: svmgov/cli
        run: cargo test --locked

  program:
    name: Build & test svmgov program
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # See the note on rustflags in the build job above.
          rustflags: ""

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .

      # cargo-build-sbf ships with the Agave release and downloads its own
      # pinned platform-tools (SBF rustc) on first use, independent of the
      # host toolchain installed above.
      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Both programs live in the repo-root workspace; artifacts land in
      # target/deploy/ at the repo root, where the LiteSVM suites load them.
      - name: Build ncn-snapshot program
        run: cargo-build-sbf --manifest-path ncn/programs/ncn-snapshot/Cargo.toml -- --locked

      - name: Build svmgov program
        run: cargo-build-sbf --manifest-path svmgov/program/programs/svmgov_program/Cargo.toml -- --locked

      # ncn-merkle-tree is a root-workspace member both programs' proof
      # verification depends on, so its unit tests ride along here.
      - name: Test svmgov program (LiteSVM) and merkle tree
        run: cargo test --locked -p svmgov_program -p ncn-merkle-tree

  clients:
    name: Build & test client crates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # See the note on rustflags in the build job above.
          rustflags: ""

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            squads-client
            ncn-router

      # The integration test target is deliberately excluded: it boots a
      # Surfnet with mainnet remote-fetch (api.mainnet-beta.solana.com), so it
      # is network-dependent and only meant for local runs. The regression
      # target pins the wire-format bytes (discriminators, PDAs) that live
      # Squads transactions depend on.
      - name: Test squads-client (unit + wire-format regression)
        working-directory: squads-client
        run: cargo test --locked --lib --test regression

      - name: Test ncn-router
        working-directory: ncn-router
        run: cargo test --locked

  frontend:
    name: Test frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installs the pnpm version pinned by frontend/package.json's
      # packageManager field.
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Next 16 requires Node >= 20.9; no .nvmrc/engines pin exists in the
          # repo, so pin the current LTS line here.
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test frontend (jest)
        working-directory: frontend
        run: pnpm run test:ci
